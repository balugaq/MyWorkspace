name: Sync to Gitee

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://guguguhello:${{ secrets.GITEE_TOKEN }}@gitee.com/guguguhello/MyWorkspace.git
          git push gitee --all --force
          git push gitee --tags --force