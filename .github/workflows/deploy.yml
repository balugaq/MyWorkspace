name: Deploy to GitHub Pages

on:
  push:
    branches: [master] # 触发部署的分支

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Test
        run: npm run lint && npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_UNOPTIMIZED_IMAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/MyWorkspace'
          NEXT_PUBLIC_ASSET_PREFIX: '/MyWorkspace'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4