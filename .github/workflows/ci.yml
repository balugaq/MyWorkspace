name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # 不依赖 node_modules，坏 lock 在安装前就失败
      - name: Peer dependencies consistency
        run: npm run check:peer-deps

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Typecheck, Lint & Test
        run: npm run typecheck && npm run lint && npm test
